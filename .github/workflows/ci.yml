name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: fmt
        run: zig fmt --check .
      - name: test
        run: zig build test
      - name: examples
        run: zig build examples
